name: Build & Publish Docker Image

# 推送 main（代码/构建文件变更时）或打 v* 标签时构建镜像并发布到 ghcr.io
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'web/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ZJYCP/bailian-studio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 服务器为 x86 时只需 amd64；如需 arm64（如 Oracle/树莓派）改为
      # platforms: linux/amd64,linux/arm64 并启用下面的 QEMU 步骤（构建时间约 3 倍）
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta（分支/版本/sha/latest 标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 国内镜像源在 CI（海外 runner）同样可用，且与本地构建行为一致
          build-args: |
            GOPROXY_MIRROR=https://goproxy.cn,direct
            NPM_REGISTRY=https://registry.npmmirror.com
